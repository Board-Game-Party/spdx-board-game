services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  unit:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg2://testuser:testpass@test-db:5432/testdb
      NODE_ENV: test
      PYTHONUNBUFFERED: "1"
    depends_on:
      test-db:
        condition: service_healthy
    command: python3 -m pytest -v

  api-test:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql+psycopg2://testuser:testpass@test-db:5432/testdb
      PROJECT_NAME: PairEval
      API_V1_STR: /api
      SECRET_KEY: test-secret
      ALLOWED_ORIGINS: http://web-test:5173,http://localhost:5173
      NODE_ENV: test
    command: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      test-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web-test:
    image: node:22-slim
    working_dir: /app/frontend
    environment:
      NODE_ENV: test
      VITE_API_URL: http://api-test:8000
    volumes:
      - ./frontend:/app/frontend:z
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      api-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    environment:
      BASE_URL: http://web-test:5173
      NODE_ENV: test
    volumes:
      - .:/app
    depends_on:
      web-test:
        condition: service_healthy
    command: sh -c "npm install && npx playwright test"
    profiles: ["e2e"]

volumes:
  frontend_node_modules:
